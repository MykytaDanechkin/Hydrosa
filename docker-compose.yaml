services:

  hydrosa_db:
    image: postgres:alpine
    container_name: hydrosa_db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"

  hydrosa_sim_db:
    image: postgres:alpine
    container_name: hydrosa_sim_db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"